<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-label="Terminal do ShiroKazer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#151a27"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf7"/>
      <stop offset="0.5" stop-color="#9db4ff"/>
      <stop offset="1" stop-color="#c7a6ff"/>
    </linearGradient>
    <clipPath id="win"><rect x="10" y="10" width="800" height="340" rx="14"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; font-size: 15px; }
    .p { fill: #7ee787; } .c { fill: #e6edf7; } .d { fill: #8b98ad; } .k { fill: #9db4ff; } .v { fill: #ffb86c; } .m { fill: #c7a6ff; }
    .line { opacity: 0; animation: show .01s forwards; }
    .l1{animation-delay:.4s}.l2{animation-delay:1.2s}.l3{animation-delay:1.6s}.l4{animation-delay:2.0s}.l5{animation-delay:2.4s}
    .l6{animation-delay:2.8s}.l7{animation-delay:3.6s}.l8{animation-delay:4.0s}.l9{animation-delay:4.8s}
    @keyframes show { to { opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; animation-delay: 4.8s; opacity: 0; }
    @keyframes blink { 0%{opacity:1} 50%{opacity:0} }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(380px); } }
    .snow { fill: #e6edf7; opacity: .0; animation: fall linear infinite; }
    @keyframes fall { 0%{transform:translateY(-10px);opacity:0} 10%{opacity:.5} 100%{transform:translateY(360px);opacity:0} }
  </style>

  <rect x="10" y="10" width="800" height="340" rx="14" fill="url(#bg)" stroke="#2a3245"/>
  <g clip-path="url(#win)">
    <rect class="scan" x="10" y="0" width="800" height="40" fill="#9db4ff" opacity=".03"/>
    <!-- neve suave: "shiro" = branco -->
    <circle class="snow" cx="620" cy="0" r="1.6" style="animation-duration:7s"/>
    <circle class="snow" cx="680" cy="0" r="1.2" style="animation-duration:9s;animation-delay:1s"/>
    <circle class="snow" cx="740" cy="0" r="1.8" style="animation-duration:8s;animation-delay:2.5s"/>
    <circle class="snow" cx="560" cy="0" r="1.1" style="animation-duration:10s;animation-delay:4s"/>
    <circle class="snow" cx="780" cy="0" r="1.4" style="animation-duration:6.5s;animation-delay:3s"/>
    <circle class="snow" cx="500" cy="0" r="1.3" style="animation-duration:11s;animation-delay:.5s"/>
  </g>

  <!-- barra da janela -->
  <path d="M10 24 a14 14 0 0 1 14 -14 h772 a14 14 0 0 1 14 14 v18 h-800z" fill="#1b2130"/>
  <circle cx="34" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="28" r="6" fill="#febc2e"/>
  <circle cx="74" cy="28" r="6" fill="#28c840"/>
  <text x="410" y="33" text-anchor="middle" class="d" style="font-size:13px">shiro@kazer: ~</text>

  <g transform="translate(34,78)">
    <text class="line l1" y="0"><tspan class="p">shiro@kazer</tspan><tspan class="d">:</tspan><tspan class="k">~</tspan><tspan class="c">$ whoami</tspan></text>
    <text class="line l2" y="30"><tspan class="d" x="16">nome</tspan><tspan x="100" fill="url(#glow)" font-weight="bold">ShiroKazer</tspan><tspan class="d">  // 白 = branco</tspan></text>
    <text class="line l3" y="54"><tspan class="d" x="16">local</tspan><tspan x="100" class="c">Brasil · BR</tspan></text>
    <text class="line l4" y="78"><tspan class="d" x="16">faz</tspan><tspan x="100" class="v">bots de Discord</tspan><tspan class="c"> · </tspan><tspan class="v">automações em Python</tspan><tspan class="c"> · </tspan><tspan class="v">suporte técnico</tspan></text>
    <text class="line l5" y="102"><tspan class="d" x="16">curte</tspan><tspan x="100" class="m">engenharia reversa</tspan><tspan class="c"> · </tspan><tspan class="m">pixel art</tspan><tspan class="c"> · </tspan><tspan class="m">Live2D</tspan><tspan class="c"> · </tspan><tspan class="m">games</tspan></text>
    <text class="line l6" y="126"><tspan class="d" x="16">status</tspan><tspan x="100" class="p">● online</tspan><tspan class="d"> — provavelmente desmontando algo pra ver como funciona</tspan></text>

    <text class="line l7" y="170"><tspan class="p">shiro@kazer</tspan><tspan class="d">:</tspan><tspan class="k">~</tspan><tspan class="c">$ cat lema.txt</tspan></text>
    <text class="line l8" y="196"><tspan class="c" x="16">"Se dá pra abrir, dá pra entender. Se dá pra entender, dá pra melhorar."</tspan></text>

    <text class="line l9" y="240"><tspan class="p">shiro@kazer</tspan><tspan class="d">:</tspan><tspan class="k">~</tspan><tspan class="c">$ </tspan></text>
    <rect class="cursor" x="128" y="227" width="9" height="17" fill="#e6edf7"/>
  </g>
</svg>
